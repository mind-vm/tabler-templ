name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated files are up to date
        run: |
          go tool templ generate
          git diff --exit-code -- '*_templ.go' || (echo "run 'go tool templ generate' and commit" && exit 1)
      - run: go vet ./...
      - run: go test ./...
